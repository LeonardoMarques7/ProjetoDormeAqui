services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dormeaqui-api
    restart: unless-stopped
    env_file:
      - ./back-end/.env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
      DATABASE_URL: ${DATABASE_URL:-postgresql://dormeaqui:dormeaqui_dev@postgres:5432/dormeaqui?schema=public}
    ports:
      - "${API_BIND_ADDRESS:-0.0.0.0}:${API_PORT:-4000}:3000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: dormeaqui-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dormeaqui}
      POSTGRES_USER: ${POSTGRES_USER:-dormeaqui}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dormeaqui_dev}
    ports:
      - "${POSTGRES_BIND_ADDRESS:-0.0.0.0}:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
